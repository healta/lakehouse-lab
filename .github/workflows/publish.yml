# Builds the four images and puts them on ghcr.io whenever something in images/ changes.
name: publish
on:
  push:
    branches: [main]
    paths: [images/**, .github/workflows/publish.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [spark, unity-catalog, airflow, jupyter]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: images/${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          # plain Docker manifests: TrueNAS cannot check the newer format for updates
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest,push=true,oci-mediatypes=false
